name: SoRa Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and verify ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: "true"
      RNLLAMA_SKIP_POSTINSTALL: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand uploaded LocalMind source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find . -maxdepth 1 -type f -name 'LocalMind-source*.zip' -print -quit)"
          if [ -n "$ZIP_PATH" ]; then
            rm -rf /tmp/localmind-extract
            mkdir -p /tmp/localmind-extract
            unzip -q "$ZIP_PATH" -d /tmp/localmind-extract
            SOURCE_DIR="$(python3 - <<'PY'
          import os
          for root, dirs, files in os.walk("/tmp/localmind-extract"):
              dirs[:] = [d for d in dirs if d not in {"node_modules", ".git"}]
              if "package.json" in files and os.path.isfile(os.path.join(root, "android", "gradlew")):
                  print(root)
                  break
          PY
          )"
            if [ -z "$SOURCE_DIR" ]; then
              echo "::error::The uploaded archive does not contain a complete React Native Android project."
              find /tmp/localmind-extract -maxdepth 5 -name package.json -print
              exit 1
            fi
            echo "Using uploaded source tree: $SOURCE_DIR"
            rsync -a --delete --exclude='.git' --exclude='.github' "$SOURCE_DIR/" ./
            rm -rf /tmp/localmind-extract
            rm -f "$ZIP_PATH"
          fi
          test -f package.json
          test -f yarn.lock
          test -f android/gradlew

      - name: Optimize Android build for phone APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          old_abi = 'abiFilters "arm64-v8a", "x86_64"'
          if old_abi in app_text:
              app_text = app_text.replace(old_abi, 'abiFilters "arm64-v8a"')
          elif 'abiFilters "arm64-v8a"' not in app_text:
              raise SystemExit("Could not safely locate Android ABI filters in app/build.gradle")
          app_gradle.write_text(app_text)

          gradle_props = Path("android/gradle.properties")
          props = gradle_props.read_text()
          props = props.replace(
              "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m",
              "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          )
          props = props.replace("# org.gradle.parallel=true", "org.gradle.parallel=true")
          props = props.replace(
              "reactNativeArchitectures=arm64-v8a,x86_64",
              "reactNativeArchitectures=arm64-v8a"
          )
          if "org.gradle.caching=true" not in props:
              props += "\n# Reuse Gradle outputs between CI and local builds.\norg.gradle.caching=true\n"
          if "org.gradle.workers.max=" not in props:
              props += "org.gradle.workers.max=4\n"
          gradle_props.write_text(props)
          PY
          grep -nE 'abiFilters|org.gradle.jvmargs|org.gradle.parallel|org.gradle.caching|reactNativeArchitectures|org.gradle.workers.max' android/app/build.gradle android/gradle.properties

      - name: Commit expanded source and ARM64 build configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: expand LocalMind source and optimize ARM64 Android build"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Source tree is already expanded and optimized."
          fi

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install JavaScript dependencies
        run: |
          # ZIP uploads do not reliably preserve executable bits on shell scripts.
          chmod +x scripts/postinstall.sh
          yarn install --frozen-lockfile --network-timeout 600000

      - name: Disable optional Foojay resolver block safely
        shell: bash
        run: |
          set -euo pipefail
          FILE="node_modules/@react-native/gradle-plugin/settings.gradle.kts"
          test -s "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("node_modules/@react-native/gradle-plugin/settings.gradle.kts")
          s = p.read_text()
          pattern = r'(?ms)^plugins\s*\{\s*id\("org\.gradle\.toolchains\.foojay-resolver-convention"\)\.version\("1\.0\.0"\)\s*\}'
          if "foojay-resolver-convention" in s:
              updated, count = re.subn(pattern, "// Foojay resolver disabled: JDK 17 is installed by CI.", s, count=1)
              if count != 1:
                  raise SystemExit("Could not safely remove the complete Foojay plugins block.")
              p.write_text(updated)
          if "foojay-resolver-convention" in p.read_text():
              raise SystemExit("Foojay resolver declaration remains.")
          PY
          # Use Google's Maven Central mirror for plugin transitive dependencies too.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("node_modules/@react-native/gradle-plugin/settings.gradle.kts")
          s = p.read_text()
          marker = "repositories {"
          mirror = 'repositories {\n    maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          if "maven-central.storage-download.googleapis.com" not in s:
              if marker not in s:
                  raise SystemExit("Could not locate pluginManagement repositories block for Maven mirror.")
              s = s.replace(marker, mirror, 1)
              p.write_text(s)
          PY
          sed -n '1,45p' "$FILE"
          sed -n '1,45p' node_modules/@react-native/gradle-plugin/settings.gradle.kts

      - name: Restore enriched Markdown native assets
        run: INIT_CWD="$GITHUB_WORKSPACE" node node_modules/react-native-enriched-markdown/postinstall.mjs

      - name: Generate SoRa launcher icons and verify assets
        run: |
          node scripts/generate-app-icons.js
          node scripts/validate-l10n.js
          node scripts/verify-fonts.js

      - name: Lightweight TypeScript check
        run: yarn typecheck

      - name: Derive llama.rn native variant allowlist
        shell: bash
        run: |
          set -euo pipefail
          VARIANTS="$(node scripts/verify-android-payload.js --print-variants)"
          echo "Native variants: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Cache llama.rn CMake build tree
        uses: actions/cache@v4
        with:
          path: node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-localmind-arm64-cxx-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-localmind-arm64-cxx-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Hexagon/QNN is optional and is not used by the MediaTek phone target.
      # Skipping its multi-GB SDK download keeps the ARM64 APK build lean and fast.

      - name: Set up C/C++ compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          max-size: 5G

      - name: Create CI-only Firebase configuration
        shell: bash
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "localmind-ci",
              "storage_bucket": "localmind-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "ai.localmind.app" }
              },
              "api_key": [{ "current_key": "localmind-ci-dummy-key" }]
            }]
          }
          JSON
          cat > .env <<'ENV'
          FIREBASE_FUNCTIONS_URL=https://localmind-ci.invalid
          ENV

      - name: Build ARM64 production debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --console=plain --max-workers=4 \
            -PreactNativeArchitectures=arm64-v8a \
            assembleProdDebug 2>&1 | tee android-build.log

      # Unit tests are run separately on demand; keeping this APK workflow focused
      # avoids slow Maven/Robolectric dependency downloads blocking phone builds.

      - name: Verify APK signature, ABI and native payload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/prod/debug/app-prod-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK was not produced; inspect android-build.log."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          # Re-sign with APK Signature Scheme V2/V3. The app minSdk is 24,
          # so legacy JAR/V1 signing is not required for supported Android versions.
          SIGNED_APK="${APK%.apk}-signed.apk"
          "$APKSIGNER" sign \
            --ks android/app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" "$APK"
          mv "$SIGNED_APK" "$APK"
          SIGNATURE_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_REPORT"
          echo "$SIGNATURE_REPORT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' || {
            echo "::error::APK V2 signature verification failed."
            exit 1
          }
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 "$APK"
          if unzip -Z1 "$APK" | grep -q '^lib/x86_64/'; then
            echo "::error::x86_64 libraries found in an ARM64-only phone APK."
            exit 1
          fi
          node scripts/verify-android-payload.js --apk "$APK" --report android-payload-report.txt
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publish direct APK download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: LocalMind Android APK
          body: |
            Latest verified ARM64 Android APK.
            Built from commit ${{ github.sha }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-Android-ARM64
          path: |
            android/app/build/outputs/apk/prod/debug/app-prod-debug.apk
            android/android-build.log
            android-payload-report.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## LocalMind Android build"
            echo ""
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            if [ -s android/app/build/outputs/apk/prod/debug/app-prod-debug.apk ]; then
              echo "- APK: built (prodDebug; CI debug signing)"
              echo "- Size: $(du -h android/app/build/outputs/apk/prod/debug/app-prod-debug.apk | cut -f1)"
              echo "- SHA-256: $(sha256sum android/app/build/outputs/apk/prod/debug/app-prod-debug.apk | cut -d' ' -f1)"
            else
              echo "- APK: not produced; inspect the build log artifact"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
